server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: behind a TLS proxy (Traefik in Dokploy) nginx only
    # sees http on port 80, so absolute Location headers would be wrong.
    absolute_redirect off;

    # Strip trailing slashes (/docs/ → /docs) so there is one URL per page.
    rewrite ^/(.+)/$ /$1 permanent;

    # Old documentation URLs → new pages (keeps existing search rankings).
    location = /docs/getting-started/ssr                  { return 301 /docs/getting-started; }
    location = /docs/miscellaneous/dictionaries           { return 301 /docs/dictionaries; }
    location = /docs/miscellaneous/load-dictionaries-callback { return 301 /docs/remote-dictionaries; }
    location = /docs/miscellaneous/switch-language        { return 301 /docs/switching-locale; }
    location = /docs/miscellaneous/extend                 { return 301 /docs/extend; }
    location = /api/search.json                           { return 410; }

    # Markdown and llms.txt for LLMs and tools.
    location ~ \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location ~ ^/llms(-full)?\.txt$ {
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Hashed build assets never change.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;
}
